<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | H302 LLC</title>
  <meta
    name="description"
    content="Contact H302 LLC about AI automations, chatbots, integrations, and workflow systems."
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="index.html">H302 LLC</a>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container narrow">
      <h1>Contact Us</h1>
      <p class="page-intro">Tell us what you want to automate.</p>

      <form id="contactForm" class="contact-form">
        <input
          type="text"
          name="Name"
          placeholder="Your Name"
          required
        />

        <input
          type="email"
          name="Email"
          placeholder="Your Email"
          required
        />

        <textarea
          name="Question"
          placeholder="What would you like to automate?"
          rows="6"
          required
        ></textarea>

        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>

      <p id="formStatus" class="form-status"></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 H302 LLC. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const form = document.getElementById("contactForm");
    const status = document.getElementById("formStatus");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      status.textContent = "Sending...";
      status.className = "form-status";

      const formData = new FormData(form);
      const payload = new URLSearchParams(formData);

      try {
        const response = await fetch("https://n8n-local.h302llc.com/webhook/lead_capture", {
          method: "POST",
          body: payload
        });

        if (response.ok) {
          status.textContent = "Thanks — your message was sent successfully.";
          status.className = "form-status success";
          form.reset();
        } else {
          status.textContent = "Something went wrong. Please try again.";
          status.className = "form-status error";
        }
      } catch (error) {
        status.textContent = "Unable to send right now. Please try again later.";
        status.className = "form-status error";
      }
    });
  </script>
</body>
</html>
